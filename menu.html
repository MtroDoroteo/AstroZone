<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menú Completo | Cafetería</title>
  <link rel="stylesheet" href="css/menu.css">
  <link rel="stylesheet" href="css/sheets-menu-extra.css">
  <script src="Javascript/components.js"></script>
</head>

<header>
  <div id="header"></div>
</header>


<body>

  <!-- ============================================================
       HERO / ENCABEZADO
       Título fijo de la página. No depende de la base de datos.
  ============================================================ -->
  <header class="hero">
    <div class="hero__text">
      <h1>Descubre nuestro<br>menú completo</h1>
    </div>
    <div class="hero__image">
      <img src="https://i.ibb.co/DXp7RbH/Gemini-Generated-Image-hgbqp2hgbqp2hgbq.jpg" alt="Gemini Generated Image hgbqp2hgbqp2hgbq" border="0" width="500">
    </div>
  </header>

  <!-- ============================================================
       NAVEGACIÓN DE CATEGORÍAS
       Las categorías (nombre, ícono, id) deberían venir también
       de la base de datos (tabla "categorias"), para no tener
       que tocar el HTML cada vez que se agregue/elimine una.
       Aquí se dejan 3 fijas como ejemplo/fallback.
  ============================================================ -->
  <nav class="categories" id="categories-nav">
    <!-- INICIO: bloque repetible por categoría (renderizado desde BD) -->
    <button class="categories__item is-active" data-category="bebidas-calientes">
      <span class="categories__icon" aria-hidden="true">☕</span>
      <span class="categories__label">Bebidas calientes</span>
    </button>
    <button class="categories__item" data-category="bebidas-frias">
      <span class="categories__icon" aria-hidden="true">🥤</span>
      <span class="categories__label">Bebidas frías</span>
    </button>
    <button class="categories__item" data-category="alimentos">
      <span class="categories__icon" aria-hidden="true">🥐</span>
      <span class="categories__label">Alimentos</span>
    </button>
    <!-- FIN: bloque repetible por categoría -->
  </nav>

  <!-- ============================================================
       GRID DE PRODUCTOS
       Se llena en tiempo real desde Google Sheets (js/sheets-menu.js).
       Cada categoría del <nav> corresponde a una pestaña (hoja) del
       Google Sheet: id, Producto, Precio, Descuento, Stock, Imagen.
  ============================================================ -->
  <!-- Contenedor que llena dinámicamente js/sheets-menu.js con los
       productos de la pestaña (hoja) de Google Sheets correspondiente
       a la categoría activa. -->
  <main class="products" id="products-grid">
    <p class="products__loading">Cargando productos…</p>
  </main>

  <script src="Javascript/sheets-menu.js" defer></script>

</body>

<footer>

  <div id="footer"></div>

</footer>

</html>
