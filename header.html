<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zona Astro - Coffee</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/header.css">
</head>
<body>

  <header class="header">
    <div class="header__inner">

    <a href="home.html">
      <img src="https://i.imgur.com/MBXxmCP.png" width="300" height="150">
    </a>

      <nav class="nav">
        <ul class="nav__list">
          <li><a href="menu.html" class="nav__link">MENÚ</a></li>
          <li><a href="nosotros.html" class="nav__link">NOSOTROS</a></li>
        </ul>
      </nav>

      <a href="carrito.html" class="btn-ordenar">Carrito</a>

      <button class="nav__toggle" aria-label="Abrir menú" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
      </button>

    </div>
  </header>

  <script>
    const toggle = document.querySelector('.nav__toggle');
    const nav = document.querySelector('.nav');

    toggle.addEventListener('click', () => {
      const isOpen = nav.classList.toggle('nav--open');
      toggle.classList.toggle('nav__toggle--active', isOpen);
      toggle.setAttribute('aria-expanded', isOpen);
    });
  </script>

</body>
</html>
